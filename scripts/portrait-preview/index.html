<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>人像贴纸 · 模块预览</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:24px;color:#5b4636;background:#f8f4ee;font:16px/1.6 system-ui}main{max-width:700px;margin:auto}h1{font-size:24px;color:#2b2116;margin:0 0 8px}p{margin:8px 0 20px}.controls{display:flex;gap:12px;flex-wrap:wrap}button,.upload{font:inherit;min-height:44px;padding:10px 16px;border:1px solid #e3d8c8;border-radius:12px;background:white;color:inherit;cursor:pointer}input{max-width:100%}button:disabled{opacity:.5;cursor:default}.results{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}figure{margin:0;width:304px;max-width:100%}figcaption{margin-bottom:12px}img{display:block;max-width:100%;height:auto;margin:auto}.paper{padding:12px 0;border-radius:12px;background:#e5edea;min-height:60px}.raw{width:280px}.sticker{width:304px}#status{min-height:26px;overflow-wrap:anywhere}small{display:block;margin-top:24px}a{color:inherit} .hidden{display:none}
</style>
<main><h1>人像贴纸效果</h1><p>暖白描边：外扩 3px、向内覆盖 1px，配淡阴影。照片仅在本机处理；这里是模块测试页，不是正式页面。</p>
<p id="file-warning" class="hidden">请通过 <a href="http://127.0.0.1:3016/">本地服务打开测试页</a>，直接打开文件不能启动抠图。</p>
<div class="controls"><label class="upload">选择照片 <input id="file" type="file" accept="image/jpeg,image/png,image/webp"></label><button id="cancel" disabled>取消处理</button><button id="sample">使用公开样本测试</button></div>
<p id="status" role="status" aria-live="polite">等待选择照片</p>
<div class="results"><figure><figcaption>原始抠图</figcaption><div class="paper"><img id="raw" class="raw" alt="未加描边的人像"></div></figure><figure><figcaption>暖白贴纸描边</figcaption><div class="paper"><img id="sticker" class="sticker" alt="暖白描边与淡阴影的人像"></div></figure></div>
<small>描边只改善细小杂边，不能消除明显背景残块。透明 PNG 已包含描边和阴影，不是仅预览用的 CSS 特效。</small></main>
<script>if(location.protocol==='file:'){document.querySelector('#file-warning').classList.remove('hidden');document.querySelector('#file').disabled=true;document.querySelector('#sample').disabled=true}</script>
<script type="module">
import {removePortraitBackground} from './helper.js';
import {createPortraitSticker} from './sticker.js?v=inner-edge-2';
let controller,sequence=0,urls=[];
const status=document.querySelector('#status'),cancel=document.querySelector('#cancel');
const phases={decoding:'正在读取照片…',loading:'正在加载本地抠图组件…',processing:'正在抠图…',finishing:'正在生成透明图片…'};
async function run(file){
  controller?.abort();const current=++sequence;const job=new AbortController();controller=job;cancel.disabled=false;
  const start=performance.now();
  try{
    const raw=await removePortraitBackground(file,{signal:job.signal,onPhase:p=>{if(current===sequence)status.textContent=phases[p]}});
    if(current!==sequence)return;status.textContent='正在生成贴纸描边…';
    const sticker=await createPortraitSticker(raw.blob,{displayWidth:280,pixelRatio:2,signal:job.signal});
    if(current!==sequence)return;
    const next=[URL.createObjectURL(raw.blob),URL.createObjectURL(sticker.blob)];
    document.querySelector('#raw').src=next[0];document.querySelector('#sticker').src=next[1];
    urls.forEach(url=>URL.revokeObjectURL(url));urls=next;
    status.textContent=`处理完成 · ${((performance.now()-start)/1000).toFixed(1)} 秒 · 外描边 3px / 内覆盖 1px · PNG ${sticker.width}×${sticker.height}`;
  }catch(error){if(current===sequence)status.textContent=error.name==='AbortError'?'已取消，之前的结果已保留。':`${error.message} 之前的结果已保留。`}
  finally{if(current===sequence)cancel.disabled=true}
}
document.querySelector('#file').onchange=e=>{if(e.target.files[0])run(e.target.files[0])};
cancel.onclick=()=>controller?.abort();
document.querySelector('#sample').onclick=async()=>{try{const response=await fetch('./sample.png');if(!response.ok)throw Error();run(new File([await response.blob()],'sample.png',{type:'image/png'}))}catch{status.textContent='公开样本不可用，请选择自己的照片。'}};
</script></html>
